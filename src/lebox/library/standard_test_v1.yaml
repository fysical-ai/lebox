# The LeBox standard test, version 1.0.
#
# Frozen: changing a task, a seed or the episode count makes a new version.
# Tasks are written in step codes (see docs/tasks.md). A task with no start
# state before '>' starts each tile it uses at one of its other standard
# states, picked from the episode's seed.

name: LeBox Standard Test
version: "1.0"
episodes: 10
seed: 2026

levels:
  - id: single
    title: one action
    groups:
      - id: stops
        title: to an end stop
        tasks: ["A1", "A2", "B25 > B0", "B75 > B100", "C0", "C4", "D1", "D5"]
      - id: marks
        title: to a middle mark
        tasks: ["A0", "B25", "B50", "B75", "C2", "D2", "D3", "D4"]
      - id: turns
        title: large valve turn
        tasks: ["B0 > B100", "B100 > B0"]

  - id: short
    title: two or three actions
    groups:
      - id: pairs
        title: two actions
        tasks: ["C0 B50", "D5 A2", "A1 C4", "B100 D3"]
      - id: triples
        title: three actions
        tasks: ["D1 A0 C2", "B0 D4 A1", "C4 B75 D2", "A2 C0 B25"]

  - id: long
    title: five or more steps
    groups:
      - id: revisit
        title: a tile used twice or put back
        tasks:
          - "C0 A2 D4 AS B0"
          - "D5 B50 C4 D1 A1"
          - "B100 A1 C0 BS D3"
          - "A2 D2 A0 C4 B25"
          - "C4 D5 B0 CS A1"
          - "D3 C0 A2 B75 D1"
      - id: timed
        title: with waits
        tasks:
          - "B50 W30 D5"
          - "C0 W10 C4 W10 C0"
          - "A1 W20 D3 W10 AS"
          - "D5 W15 B0 C4 W15 D1"

  - id: control
    title: restraint
    groups:
      - id: wait
        title: touch nothing
        tasks: ["W10"]
